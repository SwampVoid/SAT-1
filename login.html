<!DOCTYPE html>
<html lang="en">
    <title>Alarm Security System: settings</title>
    <link rel="stylesheet" href="loginStyle.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<body>
    <div class="phoneFrame">
        <div class="pageContainer">
            <div class="notch"></div>
            <div class="statusBas">
                <span style="margin-left: 1.1vh">10:30</span>
                <div class="levelBar">
                    <img src="Icons/CellularConnection.svg" alt="CelluarIcon">
                    <img src="Icons/Wifi.svg" alt="WifiIcon">
                    <img src="Icons/Battery.svg" alt="batteryIcon">
                </div>

            </div>

            <h1 class="headerText">LOGIN TO <br> YOUR ACCOUNT</h1>

            <div class="inputFieldsContainer">
                <input type="userName" class="inputField" placeholder="examplemail@gmail.com">
                <input type="passWord" class="inputField" placeholder="password">
            </div>

            <button class="loginBtn">LOGIN</button>

        </div>
    </div>
</body>

<script src="login.js"></script>

</html>
