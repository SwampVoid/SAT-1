<!DOCTYPE html>
<html lang="en">
    <title>Alarm Security System: settings</title>
    <link rel="stylesheet" href="settingsStyle.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<body>
    <div class="phoneFrame">
        <div class="pageContainer">
            <div class="notch"></div>
            <div class="statusBas">
                <span style="margin-left: 1.1vh">10:30</span>
                <div class="levelBar">
                    <img src="Icons/CellularConnection.svg" alt="CelluarIcon">
                    <img src="Icons/Wifi.svg" alt="WifiIcon">
                    <img src="Icons/Battery.svg" alt="batteryIcon">
                </div>
            </div>
            <h1 class="headerText">Alarm Security System</h1>

            
                
            <div class="ProfileContainer">
                <div class="ProfileImageBar">
                    <img class="profilePicture" src="dataBase/Adwaut.jpg" alt="">

                    <div class="profileTextContainer">
                        <h1 class="nameText">Your Name</h1>
                        <h5 class="emailText">example@email.com</h5>
                    </div>
                </div>

                <div class="Setting_User_Details_Frame"></div>
            </div>
            

            
        </div>

        <div class="bottemBar">
            <button class="navButton" id="index">Main</button>
            <button class="navButton" id="camera">Camera</button>
            <button class="navButton" id="profile">Profile</button>
            <button class="navButton active" id="settings">Settings</button>
        </div>
    </div>

    
</body>

<script src="script.js"></script>
<script src="tabBar.js"></script>
</html>
