<!DOCTYPE html>
<html lang="en">
    <title>Alarm Security System: settings</title>
    <link rel="stylesheet" href="settingsStyle.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<body>
    <div class="phoneFrame">
        <div class="pageContainer">
            <div class="notch"></div>
            <div class="statusBas">
                <span style="margin-left: 1.1vh">10:30</span>
                <div class="levelBar">
                    <img src="Icons/CellularConnection.svg" alt="CelluarIcon">
                    <img src="Icons/Wifi.svg" alt="WifiIcon">
                    <img src="Icons/Battery.svg" alt="batteryIcon">
                </div>
            </div>
            <h1 class="headerText">Alarm Security System</h1>

            
                
            <div class="ProfileContainer">
                <div class="ProfileImageBar">
                    <img class="profilePicture" src="dataBase/Adwaut.jpg" alt="">

                    <div class="profileTextContainer">
                        <span class="nameText">Your Name</span>
                        <span class="emailText">example@email.com</span>
                    </div>
                </div>

                <div class="Setting_User_Details_Frame">
                    <button class="logOutButton" id="logOutButton"><span class="logOutText">Log Out</span></button>
                </div>
            </div>

            <div class="AccountContainer" >
                <span class="accountText">Account</span>
                <button class="personal\&AccountInformation"><span>Personal & Account Information</span></button>
                <button class="privacy\&Security"><span>Privacy & Security</span></button>
                <button class="Privacy policy" id="privacy"><span>Privacy policy</span></button>
                <button class="Help\&Support"><span>Help & Support</span></button>
            </div>

            <div class="PreferencesContainer" >
                <span class="PreferencesText">Preferences</span>
                <button class="Notifications"><span>Notifications</span></button>
                <button class="Appearance"><span>Appearance</span></button>
                <button class="Language&Region"><span>Language & Region</span></button>
                <button class="Shortcuts"><span>Shortcuts</span></button>
                <button class="Location"><span>Location</span></button>
                <button class="AdjustCamera"><span>Adjust Camera</span></button>
            </div>

            <div class="FAQContainer">
                <span class="FAQText">FAQ</span>
                <button class="Contactus"><span>Contact Us</span></button>
                <button class="AdvancedSettings"><span>Advanced Settings</span></button>
            

            
        </div>

        <div class="bottemBar">
            <button class="navButton" id="index"><span>Main</span></button>
            <button class="navButton" id="camera"><span>Camera</span></button>
            <button class="navButton" id="profile"><span>Profile</span></button>
            <button class="navButton active" id="settings"><span>Settings</span></button>
        </div>
    </div>

    
</body>

<script src="settingsPage.js"></script>
<script src="tabBar.js"></script>
</html>
